<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Companion Loop Demo</title><style>
:root{--bg:#f4f2ee;--card:#fff;--ink:#1d1d1b;--mute:#6b6a66;--line:#e2dfd8;--stage:#efece6;--bad:#b4472f;--acc:#2f5d8a}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#161615;--card:#20201e;--ink:#ecebe6;--mute:#9b9a94;--line:#33322e;--stage:#2a2926}}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"PingFang SC",sans-serif}
main{max-width:1500px;margin:0 auto;padding:20px 16px 80px}h1{font-size:22px;margin:0}h2{font-size:18px;margin:34px 0 10px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}.note{color:var(--mute);max-width:980px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.t{font-weight:600}.sub{font-size:12px;color:var(--mute)}
.stage{height:230px;background:var(--stage);border-radius:8px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.stage img{max-height:220px;max-width:100%;transform-origin:50% 100%}
.row{display:flex;align-items:center;gap:8px}.mini{width:52px;height:52px;border-radius:12px;background:var(--stage);overflow:hidden;display:flex;align-items:flex-end;justify-content:center;flex:none}
.mini img{max-width:50px;max-height:50px;transform-origin:50% 100%}
.breathe{animation:breathe 4.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.022)}}
.bad{color:var(--bad);font-size:12px;word-break:break-all}.empty{color:var(--mute);font-size:12px;padding:20px;text-align:center}
</style></head><body><main>
<h1>侧边栏常驻动画 · 方案对比</h1>

const root=document.getElementById('root');
const players=[];
function fmtCost(g){if(!g)return'—';if(g.cost!=null)return'$'+(+g.cost).toFixed(3);if(g.tokens)return'≈$'+(g.tokens*0.0516/2537).toFixed(3);return'—'}
for(const [ch,label] of D.chars){
  const h=document.createElement('h2');h.textContent=ch+' · '+label;root.appendChild(h);
  const g=document.createElement('div');g.className='grid';root.appendChild(g);
  for(const m of D.methods){
    const c=D.cards[ch+'|'+m];const card=document.createElement('div');card.className='card';g.appendChild(card);
    const gen=c.gen||[];const ok=c.main!=null;
    let meta=[];
    if(c.main_ms)meta.push('循环 '+(c.main_ms/1000).toFixed(1)+'s');
    if(c.frames)meta.push(c.frames+' 帧');
    if(c.done_ms)meta.push('反应 '+(c.done_ms/1000).toFixed(1)+'s');
    if(c.seam!=null)meta.push('接缝差 '+c.seam);
    const genTxt=gen.map((x,i)=>x?((i?'反应':'主循环')+' '+(x.s!=null?Math.round(x.s)+'s ':'')+fmtCost(x)+(x.ok===false?' 失败':'')):'').filter(Boolean).join(' · ');
    card.innerHTML=`<div class="t">${c.label}</div><div class="sub">${c.note||''}</div>`;
    if(!ok){const err=gen.map(x=>x&&x.err).filter(Boolean).join(' | ');card.innerHTML+=`<div class="empty">没有生成成功</div><div class="bad">${err}</div><div class="sub">${genTxt}</div>`;continue}
    card.innerHTML+=`<div class="stage"><img class="big"></div><div class="row"><span class="mini"><img class="small"></span><button class="go">完成任务</button></div><div class="sub">${meta.join(' · ')}</div><div class="sub">生成：${genTxt}</div>`;
    const big=card.querySelector('.big'),small=card.querySelector('.small');
    const p={c,big,small,busy:false,proc:m==='proc'};players.push(p);
    const setMain=()=>{for(const im of [big,small]){im.src=c.main;}if(p.proc){big.classList.add('breathe');small.classList.add('breathe')}};
    p.setMain=setMain;setMain();
    p.play=(src,ms)=>{if(!src||!ms||p.busy)return;p.busy=true;const t='?t='+Date.now()+Math.random();if(p.proc){big.classList.remove('breathe');small.classList.remove('breathe')}
      big.src=src+t;small.src=src+t;setTimeout(()=>{p.busy=false;setMain();applyBreath()},ms)};
    card.querySelector('.go').onclick=()=>p.play(c.done,c.done_ms);
    if(p.proc&&c.fidget){const loop=()=>{setTimeout(()=>{p.play(c.fidget,c.fidget_ms);loop()},10000+Math.random()*10000)};loop()}
  }
}
function applyBreath(){const on=document.getElementById('breath').checked;for(const p of players){if(p.proc)continue;for(const im of [p.big,p.small])im.classList.toggle('breathe',on&&!p.busy)}}
document.getElementById('breath').onchange=applyBreath;
document.getElementById('all').onclick=()=>players.forEach(p=>p.play(p.c.done,p.c.done_ms));
</script></body></html>
